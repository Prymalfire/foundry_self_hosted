name: Main Deployment Pipeline
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'dev'
      layer:
        description: 'Deployment Layer'
        required: true
        default: 'all'
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TERRAFORM_REMOTE_STATE_BUCKET: ${{ vars.TERRAFORM_REMOTE_STATE_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.6 

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          verbose: false
          arch: x86

      - name: Configure Terraform Backend config
        run: |
          cat > ./tf_backend.config <<EOF
            bucket = "${{ env.TERRAFORM_REMOTE_STATE_BUCKET }}"
            region = "us-east-1"
          EOF

      - name: Apply Layer 1 Networking
        working-directory: ./layer_1_networking
        run: |
          if [ "${{ github.event.inputs.layer }}" != "all" ] && [ "${{ github.event.inputs.layer }}" != "1" ]; then
            echo "Skipping Layer 1 Networking deployment"
            exit 0
          fi
          terraform init \
          -backend-config=../tf_backend.config \
          -backend-config=key=layer_1_networking 
          terraform apply -auto-approve --var "terraform_remote_state_bucket=${{ env.TERRAFORM_REMOTE_STATE_BUCKET }}" \
          --var-file=../terraform_global_vars/.tfvars

      - name: Apply Layer 2 Storage
        working-directory: ./layer_2_storage
        run: |
          if [ "${{ github.event.inputs.layer }}" != "all" ] && [ "${{ github.event.inputs.layer }}" != "2" ]; then
            echo "Skipping Layer 2 Storage deployment"
            exit 0
          fi
          terraform init \
          -backend-config=../tf_backend.config \
          -backend-config=key=layer_2_storage 
          terraform apply -auto-approve \
          --var-file=../terraform_global_vars/.tfvars

      - name: Apply Layer 3 Servers
        working-directory: ./layer_3_servers
        run: |
          if [ "${{ github.event.inputs.layer }}" != "all" ] && [ "${{ github.event.inputs.layer }}" != "3" ]; then
            echo "Skipping Layer 3 Servers deployment"
            exit 0
          fi
          terraform init \
          -backend-config=../tf_backend.config \
          -backend-config=key=layer_3_servers 
          terraform apply -auto-approve --var "terraform_remote_state_bucket=${{ env.TERRAFORM_REMOTE_STATE_BUCKET }}" \
          --var-file=../terraform_global_vars/.tfvars

          private_key=$(terraform output -raw private_key)
          # Save privae key to S3 for later use
          echo "$private_key" > private_key.pem
          aws s3 cp private_key.pem s3://${{ env.TERRAFORM_REMOTE_STATE_BUCKET }}/private_key.pem
          rm private_key.pem