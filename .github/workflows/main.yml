name: Main Deployment Pipeline
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'dev'
      layer:
        description: 'Deployment Layer'
        required: true
        default: 'all'
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TERRAFORM_REMOTE_STATE_BUCKET: ${{ vars.TERRAFORM_REMOTE_STATE_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.6 

      - name: Configure Terraform Backend config
        run: |
          cat > ./tf_backend.config <<EOF
            bucket = "${{ env.TERRAFORM_REMOTE_STATE_BUCKET }}"
            region = "us-east-1"
          EOF
      
      - name: Apply Layer 0 VPC
        working-directory: ./layer_0_vpc
        run: |
          if [ "${{ github.event.inputs.layer }}" != "all" ] && [ "${{ github.event.inputs.layer }}" != "0" ]; then
            echo "Skipping Layer 0 VPC deployment"
            exit 0
          fi
          terraform init \
          -backend-config=../tf_backend.config \
          -backend-config=key=layer_0_vpc 
          terraform apply -auto-approve

      - name: Apply Layer 1 Networking
        working-directory: ./layer_1_networking
        run: |
          if [ "${{ github.event.inputs.layer }}" != "all" ] && [ "${{ github.event.inputs.layer }}" != "1" ]; then
            echo "Skipping Layer 1 Networking deployment"
            exit 0
          fi
          terraform init \
          -backend-config=../tf_backend.config \
          -backend-config=key=layer_1_networking 
          terraform apply -auto-approve --var "terraform_remote_state_bucket=${{ env.TERRAFORM_REMOTE_STATE_BUCKET }}"